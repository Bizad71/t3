<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>WordSpark | یادگیری هوشمند انگلیسی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">W</div>
      <div>
        <h1>WordSpark</h1>
        <p>هر کلمه، یک تجربه تازه</p>
      </div>
    </header>

    <section class="search-card" aria-label="جست‌وجوی کلمه">
      <label for="wordInput">کلمه انگلیسی موردنظرت رو بنویس</label>
      <form id="wordForm" class="search-row">
        <input id="wordInput" type="text" placeholder="مثلاً: curious" autocomplete="off" maxlength="80" required>
        <button id="goButton" type="submit">GO <span aria-hidden="true">➜</span></button>
      </form>
      <p class="hint">برای شنیدن تلفظ، روی هر کلمه انگلیسی بزن.</p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">یک کلمه وارد کن و GO رو بزن.</div>

    <section id="result" class="result-card" hidden>
      <div class="section-label">معنی کلمه</div>
      <h2 id="wordTitle" class="word-title" dir="ltr"></h2>
      <p id="wordMeaning" class="persian-text"></p>

      <div class="separator"></div>
      <div class="section-label">یک جمله انگلیسی</div>
      <p id="englishSentence" class="english-line" dir="ltr"></p>

      <div class="section-label sentence-translation-label">معنی جمله</div>
      <p id="sentenceMeaning" class="persian-text"></p>

      <div class="image-section">
        <div class="section-label">تصویر مرتبط</div>
        <div id="imageArea" class="image-area">
          <p class="image-placeholder">در حال پیدا کردن تصویر مرتبط…</p>
        </div>
        <p id="imageCaption" class="image-caption"></p>
      </div>
      <button id="anotherButton" class="another-button" type="button">✨ یک مثال تازه بساز</button>
    </section>

    <footer>برای آموزش و تمرین زبان انگلیسی ساخته شده است.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
